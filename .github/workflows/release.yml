name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-15  # Apple Silicon runner with Xcode 16 / Swift 6
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Build for arm64
        run: swift build -c release --arch arm64

      - name: Build for x86_64
        run: swift build -c release --arch x86_64

      - name: Create universal binaries
        run: |
          mkdir -p dist
          lipo -create \
            .build/arm64-apple-macosx/release/simcasterd \
            .build/x86_64-apple-macosx/release/simcasterd \
            -output dist/simcasterd
          lipo -create \
            .build/arm64-apple-macosx/release/simcasterctl \
            .build/x86_64-apple-macosx/release/simcasterctl \
            -output dist/simcasterctl

      - name: Build capture helper (universal)
        run: |
          swiftc -O -target arm64-apple-macosx14.0 \
            -o dist/CaptureSpike-arm64 \
            CaptureHelper/SimcasterCapture.swift \
            -framework AppKit -framework ScreenCaptureKit -framework CoreGraphics
          swiftc -O -target x86_64-apple-macosx14.0 \
            -o dist/CaptureSpike-x86_64 \
            CaptureHelper/SimcasterCapture.swift \
            -framework AppKit -framework ScreenCaptureKit -framework CoreGraphics
          lipo -create dist/CaptureSpike-arm64 dist/CaptureSpike-x86_64 -output dist/CaptureSpike
          rm dist/CaptureSpike-arm64 dist/CaptureSpike-x86_64

      - name: Package
        run: |
          VERSION=${GITHUB_REF_NAME}
          mkdir -p dist/Spike/CaptureSpike.app/Contents/MacOS
          cp dist/CaptureSpike dist/Spike/CaptureSpike.app/Contents/MacOS/CaptureSpike
          cp Spike/CaptureSpike.app/Contents/Info.plist dist/Spike/CaptureSpike.app/Contents/Info.plist
          rm dist/CaptureSpike
          cp com.simcaster.daemon.plist dist/
          tar -czf "dist/simcaster-$VERSION-macos-universal.tar.gz" \
            -C dist simcasterd simcasterctl Spike com.simcaster.daemon.plist
          shasum -a 256 "dist/simcaster-$VERSION-macos-universal.tar.gz" \
            | sed 's|dist/||' > dist/checksums.txt

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${GITHUB_REF_NAME}
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" \
              "dist/simcaster-$VERSION-macos-universal.tar.gz" \
              dist/checksums.txt \
              --clobber
          else
            gh release create "$VERSION" \
              "dist/simcaster-$VERSION-macos-universal.tar.gz" \
              dist/checksums.txt \
              --title "$VERSION" \
              --generate-notes
          fi
